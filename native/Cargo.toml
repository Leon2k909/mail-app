[package]
name = "mail-preview"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-kit", version = "=0.10.0", default-features = false, features = ["component"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.10.0", default-features = false, features = ["test-support"] }

[profile.release]
strip = "symbols"
